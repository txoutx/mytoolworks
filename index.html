<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Árbol de interactividad de vídeos</title>
<style>
  :root {
    --cyan:#62D4D4;
    --cyan-dark:#3A7E7E;
    --brand:#155B5B;
    --yellow:#FFC77A;
    --yellow-dark:#E6A449;
    --pink:#EAA4A4;
    --pink-dark:#D87D7D;
    --white:#FFFFFF;
  }

  * { box-sizing:border-box; }

  body {
    margin:0;
    font-family: Verdana, Arial, sans-serif;
    background:
      repeating-linear-gradient(
        176deg,
        var(--cyan) 0px,
        var(--cyan) 48px,
        var(--cyan-dark) 49px,
        var(--cyan-dark) 88px
      );
    color:var(--brand);
    min-height:100vh;
    padding:40px;
  }

  h1 {
    margin-top:0;
    color:var(--brand);
    font-size:34px;
  }

  .panel {
    background:rgba(255,255,255,0.92);
    border-radius:24px;
    padding:28px;
    max-width:1200px;
    margin:auto;
    box-shadow:0 12px 30px rgba(21,91,91,0.25);
  }

  .toolbar {
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:28px;
  }

  button {
    border:0;
    border-radius:14px;
    padding:12px 18px;
    font-weight:800;
    cursor:pointer;
    background:var(--brand);
    color:white;
  }

  button.secondary {
    background:var(--yellow-dark);
  }

  button.danger {
    background:var(--pink-dark);
  }

  .tree {
    display:flex;
    flex-direction:column;
    gap:34px;
    position:relative;
  }

  .level {
    display:flex;
    justify-content:center;
    gap:24px;
    flex-wrap:wrap;
    position:relative;
  }

  .node {
    background:white;
    border:4px solid var(--brand);
    border-radius:22px;
    padding:18px;
    width:260px;
    min-height:150px;
    position:relative;
    box-shadow:0 8px 0 rgba(21,91,91,0.18);
  }

  .node.root {
    border-color:var(--brand);
  }

  .node.level2 {
    border-color:var(--yellow-dark);
  }

  .node.level3 {
    border-color:var(--pink-dark);
  }

  .node-title {
    font-size:22px;
    font-weight:900;
    margin-bottom:12px;
  }

  label {
    display:block;
    font-size:13px;
    font-weight:800;
    margin-bottom:6px;
  }

  input,
  select {
    width:100%;
    padding:10px;
    border:2px solid #d8eaea;
    border-radius:12px;
    font-family:inherit;
    margin-bottom:10px;
  }

  .video-info {
    font-size:12px;
    color:#456;
    background:#eefafa;
    padding:8px;
    border-radius:10px;
    min-height:34px;
  }

  .children-controls {
    margin-top:14px;
    display:flex;
    gap:8px;
  }

  .children-controls button {
    flex:1;
    font-size:12px;
    padding:9px;
  }

  .connector {
    width:4px;
    height:32px;
    background:var(--brand);
    margin:auto;
    border-radius:8px;
  }

  pre {
    background:#092828;
    color:#d7ffff;
    padding:20px;
    border-radius:18px;
    overflow:auto;
    margin-top:30px;
    font-size:13px;
  }
</style>
</head>

<body>

<div class="panel">
  <h1>Árbol de interactividad de vídeos</h1>

  <div class="toolbar">
    <button onclick="setStructure(2)">Estructura 1 → 2a / 2b</button>
    <button onclick="setStructure(3)" class="secondary">Estructura 1 → 2a / 2b / 2c</button>
    <button onclick="exportJSON()">Exportar JSON</button>
    <button onclick="resetTree()" class="danger">Reset</button>
  </div>

  <div class="tree" id="tree"></div>

  <pre id="output">Aquí aparecerá el JSON exportado...</pre>
</div>

<script>
const videos = [
  { id:"v001", title:"Ezki Cuentacuentos - Intro", url:"https://vimeo.com/video1" },
  { id:"v002", title:"Ezki en el bosque", url:"https://vimeo.com/video2" },
  { id:"v003", title:"El taller creativo de Liz", url:"https://vimeo.com/video3" },
  { id:"v004", title:"Mithy el explorador", url:"https://vimeo.com/video4" },
  { id:"v005", title:"Pinxto y el cambio climático", url:"https://vimeo.com/video5" },
  { id:"v006", title:"Cuentos para soñar", url:"https://vimeo.com/video6" },
  { id:"v007", title:"Final A", url:"https://vimeo.com/video7" },
  { id:"v008", title:"Final B", url:"https://vimeo.com/video8" },
  { id:"v009", title:"Final C", url:"https://vimeo.com/video9" },
  { id:"v010", title:"Final D", url:"https://vimeo.com/video10" }
];

let structure = 2;

function createVideoSelector(nodeId) {
  const options = videos.map(v =>
    `<option value="${v.id}">${v.title}</option>`
  ).join("");

  return `
    <label>Buscar vídeo</label>
    <input type="text" placeholder="Buscar..." oninput="filterVideos(this, '${nodeId}')">

    <label>Vídeo seleccionado</label>
    <select id="select-${nodeId}" onchange="updateInfo('${nodeId}')">
      <option value="">Selecciona un vídeo</option>
      ${options}
    </select>

    <div class="video-info" id="info-${nodeId}">
      Ningún vídeo seleccionado
    </div>
  `;
}

function createNode(id, levelClass) {
  return `
    <div class="node ${levelClass}" data-node="${id}">
      <div class="node-title">${id}</div>
      ${createVideoSelector(id)}
    </div>
  `;
}

function renderTree() {
  const tree = document.getElementById("tree");

  let level2 = [];
  let level3 = [];

  if (structure === 2) {
    level2 = ["2a", "2b"];
    level3 = ["3a", "3b", "3c", "3d"];
  } else {
    level2 = ["2a", "2b", "2c"];
    level3 = ["3a", "3b", "3c", "3d"];
  }

  tree.innerHTML = `
    <div class="level">
      ${createNode("1", "root")}
    </div>

    <div class="connector"></div>

    <div class="level">
      ${level2.map(id => createNode(id, "level2")).join("")}
    </div>

    <div class="connector"></div>

    <div class="level">
      ${level3.map(id => createNode(id, "level3")).join("")}
    </div>
  `;
}

function setStructure(count) {
  structure = count;
  renderTree();
  document.getElementById("output").textContent =
    count === 2
      ? "Estructura activa: 1 → 2a / 2b → 3a / 3b / 3c / 3d"
      : "Estructura activa: 1 → 2a / 2b / 2c → 3a / 3b / 3c / 3d";
}

function filterVideos(input, nodeId) {
  const term = input.value.toLowerCase();
  const select = document.getElementById(`select-${nodeId}`);

  select.innerHTML = `<option value="">Selecciona un vídeo</option>`;

  videos
    .filter(v => v.title.toLowerCase().includes(term))
    .forEach(v => {
      const option = document.createElement("option");
      option.value = v.id;
      option.textContent = v.title;
      select.appendChild(option);
    });
}

function updateInfo(nodeId) {
  const select = document.getElementById(`select-${nodeId}`);
  const info = document.getElementById(`info-${nodeId}`);
  const video = videos.find(v => v.id === select.value);

  if (!video) {
    info.textContent = "Ningún vídeo seleccionado";
    return;
  }

  info.innerHTML = `
    <strong>${video.title}</strong><br>
    ID: ${video.id}<br>
    URL: ${video.url}
  `;
}

function getSelectedVideo(nodeId) {
  const select = document.getElementById(`select-${nodeId}`);
  const video = videos.find(v => v.id === select.value);

  return video || null;
}

function exportJSON() {
  const level2 =
    structure === 2
      ? ["2a", "2b"]
      : ["2a", "2b", "2c"];

  const level3 = ["3a", "3b", "3c", "3d"];

  const data = {
    project: "Gookapi Interactive Video Tree",
    structure: structure === 2
      ? "1 -> 2a/2b -> 3a/3b/3c/3d"
      : "1 -> 2a/2b/2c -> 3a/3b/3c/3d",

    nodes: {
      "1": {
        video: getSelectedVideo("1"),
        choices: level2
      }
    }
  };

  level2.forEach((node, index) => {
    data.nodes[node] = {
      video: getSelectedVideo(node),
      choices: level3
    };
  });

  level3.forEach(node => {
    data.nodes[node] = {
      video: getSelectedVideo(node),
      choices: []
    };
  });

  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);
}

function resetTree() {
  renderTree();
  document.getElementById("output").textContent =
    "Aquí aparecerá el JSON exportado...";
}

renderTree();
</script>

</body>
</html>
